name: Windows GDK validation

on: [pull_request, push]

permissions:
  contents: read

jobs:
  software:
    name: GDK software checks
    runs-on: windows-2025-vs2026
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install build tools
        run: choco install llvm cmake ninja -y
      - name: Select the pinned PC GDK
        shell: pwsh
        run: |
          $gdkRoot = & ./scripts/setup_gdk.ps1 -Destination (Join-Path $env:RUNNER_TEMP 'gdk260404')
          "GameDKCoreLatest=$gdkRoot" >> $env:GITHUB_ENV
      - name: Build and test Debug and Release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vsWhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vsInstall = & $vsWhere -latest -property installationPath
          & "$vsInstall/Common7/Tools/Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          cmake --preset win-amd64-gdk -DREXGLUE_BUILD_TESTS=ON
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          foreach ($configuration in @('debug', 'release')) {
            cmake --build --preset "win-amd64-gdk-$configuration" --parallel 4
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            # Hosted runners are not installed-game or vendor/interactive gates.
            # Keep pure GDK ABI/mapping tests; exclude only installed runtime cases.
            ctest --preset "win-amd64-gdk-$configuration" --output-on-failure --no-tests=error -L '^(unit|ppc)$' -LE '^installed_runtime$'
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
