name: Build platform (reusable)

on:
  workflow_call:
    inputs:
      platform:
        description: "win-amd64-gdk (Windows x64 / April 2026 PC GDK)"
        required: true
        type: string
      ref:
        description: "Git ref (SHA or tag) to check out and build"
        required: true
        type: string
      publish_mode:
        description: "'release' to upload as a GitHub release asset, 'artifact' to upload as a workflow artifact"
        required: true
        type: string
      artifact_name:
        description: "Artifact name when publish_mode is 'artifact'"
        required: false
        type: string
        default: ""
    outputs:
      version:
        description: "Derived build version string (REXGLUE_VERSION_STRING)"
        value: ${{ jobs.build.outputs.version }}

jobs:
  build:
    runs-on: windows-2025-vs2026
    outputs:
      version: ${{ steps.version.outputs.v }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Install toolchain
        run: choco install llvm cmake ninja -y

      - name: Select the pinned PC GDK
        shell: pwsh
        run: |
          $gdkRoot = & ./scripts/setup_gdk.ps1 -Destination (Join-Path $env:RUNNER_TEMP 'gdk260404')
          "GameDKCoreLatest=$gdkRoot" >> $env:GITHUB_ENV

      - name: Set up the x64 developer environment
        shell: pwsh
        run: |
          $vsWhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vsInstall = & $vsWhere -latest -property installationPath
          & "$vsInstall/Common7/Tools/Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          foreach ($name in @('INCLUDE', 'LIB', 'LIBPATH', 'PATH')) {
            "$name=$([Environment]::GetEnvironmentVariable($name))" >> $env:GITHUB_ENV
          }

      - name: Set up sccache
        uses: hendrikmuhs/ccache-action@v1.2.22
        with:
          variant: sccache
          key: ${{ inputs.platform }}

      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: cmake --preset ${{ inputs.platform }} -DCMAKE_C_COMPILER="${{ env.CC }}" -DCMAKE_CXX_COMPILER="${{ env.CXX }}" -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build and install
        run: cmake --build out/build/${{ inputs.platform }} --target install --parallel

      - name: sccache stats
        if: always()
        shell: bash
        run: sccache --show-stats || true

      - name: Read version
        id: version
        shell: bash
        run: |
          v=$(sed -nE 's/^#define REXGLUE_VERSION_STRING "([^"]+)".*/\1/p' \
            out/build/${{ inputs.platform }}/include/rex/version.h)
          echo "v=${v}" >> "$GITHUB_OUTPUT"

      - name: Package
        shell: bash
        run: |
          cd out/install
          7z a "rexglue-sdk-${{ steps.version.outputs.v }}-${{ inputs.platform }}.zip" ${{ inputs.platform }}

      - name: Upload as release asset
        if: inputs.publish_mode == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: out/install/rexglue-sdk-*-${{ inputs.platform }}.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload as workflow artifact
        if: inputs.publish_mode == 'artifact'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.artifact_name }}
          path: out/install/rexglue-sdk-*-${{ inputs.platform }}.zip
          retention-days: 14
